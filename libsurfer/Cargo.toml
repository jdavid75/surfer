[package]
name = "libsurfer"
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "Waveform viewer for VCD, FST, and GHW"
repository.workspace = true

[target.'cfg(all(not(windows), not(target_arch = "wasm32")))'.dependencies]
notify.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ahash.workspace = true
directories.workspace = true
extism = { workspace = true, optional = true }
extism-convert = { workspace = true, optional = true }
extism-manifest = { workspace = true, optional = true }
fst-writer.workspace = true
futures = { workspace = true, features = ["executor"] }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["sync"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wasm-tracing.workspace = true
web-sys.workspace = true

[target.'cfg(not(target_os = "unknown"))'.dev-dependencies]
tempfile.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["performance_plot", "https"]
accesskit = ["eframe/accesskit", "eframe/web_screen_reader"]
f128 = ["dep:f128"]
https = ["reqwest/rustls-no-provider", "dep:rustls"]
performance_plot = ["dep:egui_plot"]
python = ["pyo3", "surfer-translation-types/pyo3"]
# Enable when building the wasm32 target for the VS Code extension.
# Activates VS Code-specific behaviour (e.g. receiving the file URL via postMessage
# rather than reading it from URL search params).
vscode = []
wasm_plugins = [
    "dep:extism",
    "dep:extism-manifest",
    "dep:extism-convert",
    "surfer-translation-types/wasm_plugins",
]

[dependencies]
base64.workspace = true
bincode.workspace = true
bytes.workspace = true
bytesize.workspace = true
camino.workspace = true
chrono = { workspace = true, default-features = false, features = ["clock", "serde"] }
config.workspace = true
derive_more.workspace = true
ecolor.workspace = true
eframe.workspace = true
egui.workspace = true
egui-remixicon.workspace = true
egui_extras.workspace = true
egui_plot = { workspace = true, optional = true }
emath.workspace = true
enum-iterator.workspace = true
epaint.workspace = true
eyre.workspace = true
f128 = { workspace = true, optional = true }
ftr_parser.workspace = true
futures-core.workspace = true
futures-util.workspace = true
fuzzy-matcher.workspace = true
half.workspace = true
instruction-decoder.workspace = true
itertools.workspace = true
leb128.workspace = true
local-impl.workspace = true
lz4_flex.workspace = true
num.workspace = true
numeric-sort.workspace = true
pure-rust-locales.workspace = true
pyo3 = { workspace = true, optional = true }
rayon.workspace = true
regex.workspace = true
reqwest.workspace = true
rfd.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
softposit.workspace = true
surfer-gtkwave-parser = { path = "../surfer-gtkwave-parser" }
surfer-translation-types = { path = "../surfer-translation-types", default-features = false }
surfer-wcp = { path = "../surfer-wcp" }
surver.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
web-time.workspace = true
wellen.workspace = true

[build-dependencies]
vergen-gitcl = { workspace = true, features = ["build"] }

[dev-dependencies]
egui_skia_renderer = { git = "https://gitlab.com/oscargus/egui_skia_renderer.git", rev = "11b95292b5019b0639e7a4deffd4b89b50d27f50" }
image.workspace = true
image-compare.workspace = true
port_check.workspace = true
project-root.workspace = true
test-log.workspace = true
